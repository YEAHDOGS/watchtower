# WATCHTOWER overrides — NOT the source of truth.
# The YEAHDOGS org API decides WHAT gets monitored (every repo with GitHub
# Pages enabled, discovered fresh on each run). This file only customizes HOW:
# per-repo content checks, friendly names, or skip flags.
# Repos not listed here are monitored with defaults: HTTP 200 + serves HTML.
# Allowed keys per repo: name, expect_status, expect_content, skip.
overrides:
  paper:
    expect_content: PAPER. Fake money
  dashboard:
    expect_content: DOGS Mission Control
  icecream:
    expect_content: The Scoop
  wax:
    expect_content: Wax — Never Miss a Drop
  divorce:
    expect_content: Uncontested Divorce
  news:
    expect_content: DOGS NEWS
