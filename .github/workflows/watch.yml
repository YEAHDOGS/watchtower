name: watch

on:
  schedule:
    - cron: "0 * * * *" # HTTP checks every hour
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watchtower-status
  cancel-in-progress: false

jobs:
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Discover org sites + HTTP checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node checks/http-check.mjs
      - name: Commit status
        run: |
          git config user.name "Jack"
          git config user.email "noreply@anthropic.com"
          git pull --rebase || true
          git add state.json STATUS.md status.json
          git diff --cached --quiet && echo "no changes" || git commit -m "watch: http status $(date -u +%FT%TZ)"
          git push
