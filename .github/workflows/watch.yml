name: watch

on:
  schedule:
    - cron: "0 * * * *" # HTTP checks every hour
    - cron: "0 6 * * *" # full Playwright e2e daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the Playwright e2e suite"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: watchtower-status
  cancel-in-progress: false

jobs:
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Discover org sites + HTTP checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node checks/http-check.mjs
      - name: Commit status
        run: |
          git config user.name "Jack"
          git config user.email "noreply@anthropic.com"
          git pull --rebase || true
          git add state.json STATUS.md status.json
          git diff --cached --quiet && echo "no changes" || git commit -m "watch: http status $(date -u +%FT%TZ)"
          git push

  e2e:
    needs: http
    if: github.event.schedule == '0 6 * * *' || github.event.inputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (discovers org sites at runtime)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx playwright test
      - name: Ingest e2e results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node checks/e2e-report.mjs e2e-report.json
      - name: Commit status
        if: always()
        run: |
          git config user.name "Jack"
          git config user.email "noreply@anthropic.com"
          git pull --rebase || true
          git add state.json STATUS.md status.json
          git diff --cached --quiet && echo "no changes" || git commit -m "watch: e2e status $(date -u +%FT%TZ)"
          git push
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: screenshots/
